<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportApp — Статистика</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard-container">
    <header class="dashboard-header">
      <h1>СТАТИСТИКА</h1>
    </header>

    <div class="stats-summary">
      <div class="stat-big-card">
        <span class="stat-big-label">Тренировок</span>
        <span class="stat-big-number" id="totalWorkouts">0</span>
      </div>
      <div class="stat-big-card">
        <span class="stat-big-label">Минут</span>
        <span class="stat-big-number" id="totalMinutes">0</span>
      </div>
      <div class="stat-big-card">
        <span class="stat-big-label">Упражнений</span>
        <span class="stat-big-number" id="totalExercises">0</span>
      </div>
    </div>

    <h2 style="margin:1.5rem 0 1rem 1rem; font-size:1.2rem;">По группам мышц</h2>
    <div class="stats-muscles" id="musclesStats"></div>

    <h2 style="margin:1.5rem 0 1rem 1rem; font-size:1.2rem;">Календарь тренировок</h2>
    <div class="calendar-container">
      <div class="calendar-nav">
        <button id="prevMonth" class="btn-calendar-nav"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="currentMonthYear">Июль 2026</span>
        <button id="nextMonth" class="btn-calendar-nav"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div class="calendar-grid">
        <div class="calendar-weekday">Пн</div>
        <div class="calendar-weekday">Вт</div>
        <div class="calendar-weekday">Ср</div>
        <div class="calendar-weekday">Чт</div>
        <div class="calendar-weekday">Пт</div>
        <div class="calendar-weekday">Сб</div>
        <div class="calendar-weekday">Вс</div>
        <div id="calendarDays" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;grid-column:1/-1;"></div>
      </div>
    </div>

    <h2 style="margin:1.5rem 0 1rem 1rem; font-size:1.2rem;">История тренировок</h2>
    <div id="workoutHistory" style="display:flex;flex-direction:column;gap:0.8rem;"></div>
  </main>

  <nav class="bottom-nav">
    <div class="nav-items">
      <button class="nav-item active" onclick="window.location.href='stats.html'">
        <i class="fa-solid fa-chart-bar"></i>
      </button>
      <button class="nav-item" onclick="window.location.href='index.html'">
        <i class="fa-solid fa-dumbbell"></i>
      </button>
      <button class="nav-item" onclick="window.location.href='profile.html'">
        <i class="fa-solid fa-user"></i>
      </button>
    </div>
  </nav>

  <script>
    function getWorkouts() {
      return JSON.parse(localStorage.getItem('myWorkouts')) || [];
    }

    function loadStats() {
      const workouts = getWorkouts();
      const total = workouts.length;
      const totalMinutes = workouts.reduce((sum, w) => sum + (w.duration || 0), 0);
      const totalExercises = workouts.reduce((sum, w) => sum + (w.exercises?.length || 0), 0);

      document.getElementById('totalWorkouts').textContent = total;
      document.getElementById('totalMinutes').textContent = totalMinutes;
      document.getElementById('totalExercises').textContent = totalExercises;

      const muscleGroups = ['Руки', 'Пресс', 'Грудь', 'Спина', 'Ноги'];
      const container = document.getElementById('musclesStats');
      
      const muscleCounts = muscleGroups.map(m => {
        return workouts.filter(w => w.title === m).length;
      });
      
      const maxCount = Math.max(1, ...muscleCounts);
      
      container.innerHTML = muscleGroups.map((m, i) => {
        const count = muscleCounts[i];
        const percent = Math.round((count / maxCount) * 100);
        return `
          <div class="stat-muscle-item">
            <span class="muscle-name">${m}</span>
            <div class="muscle-bar"><div class="muscle-fill" style="width:${percent}%;"></div></div>
            <span class="muscle-count">${count}</span>
          </div>
        `;
      }).join('');

      const historyContainer = document.getElementById('workoutHistory');
      if (workouts.length === 0) {
        historyContainer.innerHTML = '<p style="color:var(--slate);text-align:center;">Нет выполненных тренировок</p>';
      } else {
        historyContainer.innerHTML = workouts.slice().reverse().map(w => `
          <div style="background:var(--white);padding:1rem;border-radius:12px;border-left:4px solid var(--crimson);">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <strong>${w.title}</strong>
              <span style="color:var(--slate);font-size:0.9rem;">${new Date(w.date).toLocaleDateString('ru-RU')}</span>
            </div>
            <div style="color:var(--slate);font-size:0.9rem;margin-top:0.3rem;">
              ${w.duration || 0} мин · ${w.exercises?.length || 0} упражнений
            </div>
          </div>
        `).join('');
      }
    }

    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    function getWorkoutDays() {
      const workouts = getWorkouts();
      return workouts.map(w => new Date(w.date));
    }

    function renderCalendar(month, year) {
      const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                         'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      document.getElementById('currentMonthYear').textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startDayOfWeek = firstDay.getDay() || 7;
      const container = document.getElementById('calendarDays');
      container.innerHTML = '';

      for (let i = 1; i < startDayOfWeek; i++) {
        const empty = document.createElement('div');
        empty.classList.add('calendar-empty');
        container.appendChild(empty);
      }

      const today = new Date();
      const workoutDays = getWorkoutDays();

      for (let day = 1; day <= daysInMonth; day++) {
        const dayEl = document.createElement('div');
        dayEl.classList.add('calendar-day');
        dayEl.textContent = day;

        const hasWorkout = workoutDays.some(d =>
          d.getDate() === day && d.getMonth() === month && d.getFullYear() === year
        );
        if (hasWorkout) dayEl.classList.add('has-workout');
        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          dayEl.classList.add('today');
        }
        container.appendChild(dayEl);
      }
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar(currentMonth, currentYear);
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar(currentMonth, currentYear);
    });

    loadStats();
    renderCalendar(currentMonth, currentYear);
  </script>
</body>
</html>
